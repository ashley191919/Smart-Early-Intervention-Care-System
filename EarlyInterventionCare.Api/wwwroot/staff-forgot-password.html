<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="早療智慧動態照護系統醫療人員忘記密碼頁面">
    <title>忘記密碼｜早療智慧動態照護系統</title>
    <link rel="stylesheet" href="css/auth-common.css">
    <link rel="stylesheet" href="css/staff-forgot-password.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card forgot-password-card" aria-labelledby="system-title">
            <header class="system-header">
                <div class="hospital-brand">
                    <img class="hospital-logo" src="images/hospital-logo.png" alt="天主教輔仁大學附設醫院院徽">
                    <div class="hospital-name">
                        <span class="hospital-title">天主教輔仁大學附設醫院</span>
                        <span class="hospital-subtitle">FU JEN CATHOLIC UNIVERSITY HOSPITAL</span>
                    </div>
                </div>
                <h1 id="system-title">早療智慧動態照護系統</h1>
                <p class="system-subtitle">Early Intervention Smart Care System</p>
            </header>

            <section class="forgot-password-content" aria-labelledby="forgot-password-title">
                <h2 id="forgot-password-title">忘記密碼</h2>
                <p class="forgot-password-description">請輸入以下資料以進行下一步驗證。</p>

                <form class="forgot-password-form" novalidate>
                    <div class="form-field">
                        <label for="organization-code">單位代碼</label>
                        <input id="organization-code" name="organization-code" type="text" placeholder="請輸入單位代碼" autocomplete="organization">
                    </div>

                    <div class="form-field">
                        <label for="staff-account">醫療人員帳號</label>
                        <input id="staff-account" name="staff-account" type="text" placeholder="請輸入醫療人員帳號" autocomplete="username">
                    </div>

                    <button class="login-button" type="button">下一步</button>
                </form>

                <a class="return-login-link" href="staff-login.html">返回登入</a>
            </section>

            <div class="help-link-wrap">
                <a class="help-link" href="#">ⓘ 系統操作說明與常見問題（FAQ）</a>
            </div>
        </section>

        <footer class="page-footer">
            <p>輔仁大學附設醫院 兒童發展聯合評估中心｜聯絡電話：02-8512-8888 分機 12345</p>
            <p>登入即表示您同意本系統之<a href="#">服務條款</a>與<a href="#">隱私權政策</a></p>
            <p>© 2026 Fu Jen Catholic University Hospital. All rights reserved.</p>
        </footer>
    </main>

    <script src="js/staff-forgot-password.js"></script>
</body>
</html>
