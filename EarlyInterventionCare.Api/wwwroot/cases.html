<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="早療智慧動態照護系統醫療人員個案管理列表">
    <title>早療個案管理｜早療智慧動態照護系統</title>
    <link rel="stylesheet" href="css/staff-dashboard.css">
    <link rel="stylesheet" href="css/cases.css">
</head>
<body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M12 21V11M12 15C5 15 3 10 4 4c6 0 8 4 8 11ZM12 17c0-6 3-9 9-9 0 6-3 9-9 9Z"/></symbol>
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3ZM9 21v-8h6v8"/></symbol>
        <symbol id="icon-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
        <symbol id="icon-clipboard" viewBox="0 0 24 24"><path d="M8 5H4v16h16V5h-4M8 3h8v5H8ZM8 12h8M8 16h6"/></symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4M12 1v1"/></symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16v-5M12 16V7M17 16V4"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3-1-2 4 3 2-1 3-2 2 3 3 3-2 3 1 1 3h4l1-3 3-1 3 1 2-4-3-2 1-3 2-2-3-3-3 2-3-1-1-3Z" transform="translate(1 -1) scale(.92)"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    </svg>

    <div class="dashboard-shell">
        <aside class="sidebar" aria-label="主要導覽">
            <a class="brand" href="staff-dashboard.html" aria-label="早療智慧動態照護系統首頁">
                <span class="brand-symbol"><svg aria-hidden="true"><use href="#icon-leaf"/></svg></span>
                <span class="brand-copy">
                    <strong>早療智慧動態照護</strong>
                    <small>醫療人員工作台</small>
                </span>
            </a>

            <nav class="main-nav" aria-label="系統功能">
                <p class="nav-label">醫療人員工作台</p>
                <a class="nav-item" href="staff-dashboard.html"><svg aria-hidden="true"><use href="#icon-home"/></svg>總覽</a>
                <a class="nav-item is-active" href="cases.html" aria-current="page"><svg aria-hidden="true"><use href="#icon-person"/></svg>個案管理</a>
                <a class="nav-item" href="#assessments"><svg aria-hidden="true"><use href="#icon-clipboard"/></svg>評估與紀錄</a>
                <a class="nav-item" href="staff-dashboard.html#alerts"><svg aria-hidden="true"><use href="#icon-bell"/></svg>追蹤提醒 <span class="notification-count">3</span></a>
                <a class="nav-item" href="#reports"><svg aria-hidden="true"><use href="#icon-chart"/></svg>統計報表</a>
                <p class="nav-label nav-label-secondary">系統</p>
                <a class="nav-item" href="#settings"><svg aria-hidden="true"><use href="#icon-settings"/></svg>系統設定</a>
            </nav>

            <div class="sidebar-footer">
                <p>輔仁大學附設醫院</p>
                <small>兒童發展聯合評估中心</small>
            </div>
        </aside>

        <div class="page-area">
            <header class="topbar">
                <div class="hospital-header">
                    <img class="hospital-header-logo" src="images/hospital-logo.png" alt="天主教輔仁大學附設醫院院徽">
                    <span class="hospital-header-copy"><strong>天主教輔仁大學附設醫院</strong><small>FU JEN CATHOLIC UNIVERSITY HOSPITAL</small></span>
                </div>
                <div class="topbar-spacer"></div>
                <button class="topbar-action" type="button" aria-label="通知"><svg aria-hidden="true"><use href="#icon-bell"/></svg><i></i></button>
                <button class="staff-menu" type="button" aria-label="開啟使用者選單">
                    <span class="staff-avatar">王</span>
                    <span class="staff-details"><strong>王怡安</strong><small>醫療行政人員</small></span>
                    <svg class="chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
                </button>
            </header>

            <main id="main-content" class="dashboard-content cases-content">
                <section class="page-heading" aria-labelledby="cases-title">
                    <div>
                        <p class="eyebrow">MEDICAL WORKSPACE</p>
                        <h1 id="cases-title">早療個案管理</h1>
                        <p>查看與管理早療個案資料及目前處理進度</p>
                    </div>
                    <a class="primary-button" href="case-create.html"><svg aria-hidden="true"><use href="#icon-plus"/></svg>新增個案</a>
                </section>

                <section class="panel cases-panel" aria-label="早療個案列表">
                    <div class="cases-toolbar">
                        <div class="cases-search" role="search">
                            <label class="sr-only" for="cases-search-input">搜尋個案姓名或個案編號</label>
                            <svg aria-hidden="true"><use href="#icon-search"/></svg>
                            <input id="cases-search-input" type="search" placeholder="搜尋個案姓名或個案編號" autocomplete="off" aria-controls="cases-list">
                        </div>
                        <div class="cases-filters" role="group" aria-label="個案處理狀態篩選">
                            <button class="cases-filter is-selected" type="button" data-filter-status="all" aria-pressed="true" aria-controls="cases-list">全部</button>
                            <button class="cases-filter" type="button" data-filter-status="pending-contact" aria-pressed="false" aria-controls="cases-list">待聯繫</button>
                            <button class="cases-filter" type="button" data-filter-status="in-progress" aria-pressed="false" aria-controls="cases-list">進行中</button>
                            <button class="cases-filter" type="button" data-filter-status="completed" aria-pressed="false" aria-controls="cases-list">已完成</button>
                        </div>
                    </div>

                    <div class="table-wrap cases-table-wrap" role="region" aria-label="個案資料表，可橫向捲動" tabindex="0">
                        <table class="cases-table">
                            <caption class="sr-only">早療個案姓名、編號、處理狀態、優先程度、聯絡人與最近更新時間</caption>
                            <thead>
                                <tr>
                                    <th scope="col">個案</th>
                                    <th scope="col">個案編號</th>
                                    <th scope="col">處理狀態</th>
                                    <th scope="col">優先程度</th>
                                    <th scope="col">聯絡人</th>
                                    <th scope="col">最近更新</th>
                                    <th scope="col">操作</th>
                                </tr>
                            </thead>
                            <tbody id="cases-list">
                                <tr><td class="cases-empty" colspan="7">正在載入個案…</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="cases-list-footer">
                        <p id="cases-range" class="cases-range" role="status" aria-live="polite" aria-atomic="true"></p>
                        <nav id="cases-pagination" class="cases-pagination" aria-label="個案列表分頁"></nav>
                    </div>
                    <noscript><p class="cases-empty">請啟用 JavaScript，以使用個案列表、搜尋與分頁功能。</p></noscript>
                </section>
            </main>
        </div>
    </div>
    <script src="js/cases.js" defer></script>
</body>
</html>
