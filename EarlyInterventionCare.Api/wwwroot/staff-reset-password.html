<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="早療智慧動態照護系統醫療人員重設密碼頁面">
    <title>重設密碼｜早療智慧動態照護系統</title>
    <link rel="stylesheet" href="css/auth-common.css">
    <link rel="stylesheet" href="css/staff-reset-password.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card reset-password-card" aria-labelledby="system-title">
            <header class="system-header">
                <div class="hospital-brand">
                    <img class="hospital-logo" src="images/hospital-logo.png" alt="天主教輔仁大學附設醫院院徽">
                    <div class="hospital-name">
                        <span class="hospital-title">天主教輔仁大學附設醫院</span>
                        <span class="hospital-subtitle">FU JEN CATHOLIC UNIVERSITY HOSPITAL</span>
                    </div>
                </div>
                <h1 id="system-title">早療智慧動態照護系統</h1>
                <p class="system-subtitle">Early Intervention Smart Care System</p>
            </header>

            <section class="reset-password-content" aria-labelledby="reset-password-title">
                <h2 id="reset-password-title">重設密碼</h2>
                <p class="reset-password-description">請設定您的新登入密碼。</p>

                <form class="reset-password-form" novalidate>
                    <div class="form-field">
                        <label for="new-password">新密碼</label>
                        <input id="new-password" name="new-password" type="password" placeholder="請輸入新密碼" autocomplete="new-password" aria-describedby="password-error">
                    </div>

                    <div class="form-field">
                        <label for="confirm-password">確認新密碼</label>
                        <input id="confirm-password" name="confirm-password" type="password" placeholder="請再次輸入新密碼" autocomplete="new-password" aria-describedby="password-error">
                    </div>

                    <p id="password-error" class="password-error" aria-live="polite" hidden></p>
                    <button class="login-button" type="button">確認重設</button>
                </form>

                <a class="return-login-link" href="staff-login.html">返回登入</a>
            </section>

            <div class="help-link-wrap">
                <a class="help-link" href="#">ⓘ 系統操作說明與常見問題（FAQ）</a>
            </div>
        </section>

        <footer class="page-footer">
            <p>輔仁大學附設醫院 兒童發展聯合評估中心｜聯絡電話：02-8512-8888 分機 12345</p>
            <p>登入即表示您同意本系統之<a href="#">服務條款</a>與<a href="#">隱私權政策</a></p>
            <p>© 2026 Fu Jen Catholic University Hospital. All rights reserved.</p>
        </footer>
    </main>

    <script src="js/staff-reset-password.js"></script>
</body>
</html>
